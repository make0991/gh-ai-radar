name: AI Coding Radar

on:
  schedule:
    # 每天 UTC 01:17 跑一次（≈ 北京时间上午 9:17）。
    # 避开 GitHub Actions 整点高峰，降低 schedule 被延迟或丢弃的概率。
    # 想改频率就改这行 cron：
    #   每周一次       -> "17 1 * * 1"
    #   每周一三五     -> "17 1 * * 1,3,5"
    - cron: "17 1 * * *"
  workflow_dispatch: {}   # 允许手动触发（Actions 页面点按钮即可）

permissions:
  contents: write          # 需要写权限把报告 commit 回仓库

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run radar
        env:
          # 用 Actions 自带的 GITHUB_TOKEN 即可，无需额外配置。
          # 它对公开仓库的搜索/读取权限足够用。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/radar.py --config config.yaml
        # 想用扩展版扫描范围，把上面一行换成：
        #   run: python scripts/radar.py --config config.wide.yaml

      - name: Email report
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          MAIL_TO:        ${{ secrets.MAIL_TO }}
        run: |
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASS" ] || [ -z "$MAIL_TO" ]; then
            echo "未配置邮件 secrets，跳过邮件发送"
          else
            python scripts/send_email.py
          fi

      - name: Commit report
        run: |
          git config user.name  "ai-coding-radar[bot]"
          git config user.email "actions@github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "radar: $(date -u +%Y-%m-%d) 报告更新"
            git push
          fi
